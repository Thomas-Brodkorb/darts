<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./pictures/Darts.JPG" sizes="32x32">
  <title>Darts - Visits</title>
  <link rel="stylesheet" href="./darts.css" />
</head>

<body>

  <div class="page-grid">
    <aside class="sidebar">
      <h2>Pages</h2>
      <ul>
        <li><a href="./legs.html">Play / Legs (default)</a></li>
        <li><a href="./trainings.html">Trainings</a></li>
        <li><a href="./stats.html">Stats</a></li>
        <li><a href="./players.html">Players</a></li>
        <li><a href="./visits.html">Visits</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <h1>Stats</h1>
      <section>
        
        <h2>Average visits</h2>
        <div class="panel">
          <div class="two-columns">
            <div id="averagesMonthContainer">
              <h3>this month</h3>
              <div id="averagesMonth">Loading…</div>
            </div>
            <div id="averagesAllContainer">
              <h3>all times</h3>
              <div id="averagesAll">Loading…</div>
            </div>
          </div>
          <canvas id="visits"></canvas>
          <div style="margin-top:8px;"><button id="refreshAverages">Refresh</button></div>
        </div>
      </section>



      <section>
        <h2>Legs</h2>
        <div class="panel">
          <h3>Winners</h3>
          <div class="two-columns">
            <div id="legsWinnersMonthContainer">
              <h4>this month</h4>
              <div id="legsWinnersMonth">Loading…</div>
            </div>
            <div id="legsWinnersAllContainer">
              <h4>all times</h4>
              <div id="legsWinnersAll">Loading…</div>
            </div>
          </div>
          <div style="margin-top:8px; display:flex; gap:12px; align-items:center;">
            <label style="display:flex; gap:6px; align-items:center;">
              <input type="checkbox" id="showAllTimesLegs" />
              <span>show all times legs</span>
            </label>
            <button id="refreshLegs">Refresh</button>
          </div>
          <div id="legsDetails" style="margin-top:12px;">Loading…</div>
        </div>
      </section>

      <section>
        <h2>Trainings</h2>
        <div class="panel">
          <div style="margin-top:8px; display:flex; gap:12px; align-items:center;">
            <label style="display:flex; gap:6px; align-items:center;">
              <input type="checkbox" id="showAllTimesTrainings" />
              <span>show all times</span>
            </label>
            <button id="refreshTrainings">Refresh</button>
          </div>
          <div id="trainingsDetails" style="margin-top:12px;">Loading…</div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
  <script src="/node_modules/chart.js/dist/chart.umd.min.js"></script>
  <script src="chartvisits.js"></script>

</body>

</html>
